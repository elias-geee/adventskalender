name = "advent-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Cache für Contexto-Bewertungen (gleiches Wort → immer gleiche Temperatur)
[[kv_namespaces]]
binding = "CONTEXTO_CACHE"
id = "46e8ddec645149bda82482f28fc2de17"

[vars]
# Deine GitHub-Pages-Adresse eintragen (ohne Slash am Ende). localhost ist immer erlaubt.
ALLOWED_ORIGINS = "https://elias-geee.github.io"

# Den API-Key NICHT hier eintragen, sondern als Secret:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Für lokales Testen: Datei worker/.dev.vars mit ANTHROPIC_API_KEY=... anlegen (ist in .gitignore).
